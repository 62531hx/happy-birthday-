<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <!-- Google Fonts for cute typography -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-pink: #ffd1dc;
            --color-white: #fff;
            --color-black: #333333;
            --color-text-pink: #ff6b8b;
            --color-bg-letter: #fff5f7;
            --color-border: #ff8da1;
        }

        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            position: relative;
            font-family: 'Comfortaa', cursive, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, var(--color-pink), #ffc1cc, #ffe4e9);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background grid/pattern vibe */
        .wrapper {
            position: relative;
            width: 90%;
            max-width: 850px;
            height: 480px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 107, 139, 0.2);
            border: 3px dashed var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px;
            z-index: 10;
        }

        /* Left Content */
        .left-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        h1 {
            font-size: 3.2rem;
            color: var(--color-text-pink);
            font-family: 'Dancing Script', cursive;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
        }

        .date-badge {
            background-color: var(--color-white);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            color: var(--color-black);
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 2px solid var(--color-pink);
        }

        .click-btn {
            background-color: var(--color-text-pink);
            color: var(--color-white);
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 139, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .click-btn:hover {
            transform: scale(1.05);
            background-color: #ff5277;
        }

        /* Right Content (Avatar Circle) */
        .right-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-container {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 4px solid var(--color-white);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            overflow: hidden;
            background-color: var(--color-white);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name-tag {
            margin-top: 15px;
            background-color: var(--color-text-pink);
            color: var(--color-white);
            padding: 6px 20px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(255, 107, 139, 0.3);
        }

        /* Floating Hearts Animation Elements */
        .heart {
            position: absolute;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ff6b8b"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>') no-repeat center;
            background-size: contain;
            animation: floatUp 4s linear infinite;
            opacity: 0.7;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.6);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        /* Pop-up Letter Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .letter-card {
            width: 90%;
            max-width: 600px;
            background: var(--color-bg-letter);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 2px solid var(--color-border);
            display: flex;
            position: relative;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .letter-card {
            transform: scale(1);
        }

        .letter-left {
            flex: 1;
            background: var(--color-pink);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            border: 2px dashed var(--color-white);
        }

        .letter-left img {
            max-width: 100%;
            max-height: 180px;
            border-radius: 8px;
        }

        .letter-right {
            flex: 1.2;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .letter-right h3 {
            color: var(--color-text-pink);
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .letter-right p {
            font-size: 0.9rem;
            color: var(--color-black);
            line-height: 1.6;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--color-text-pink);
            cursor: pointer;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .wrapper {
                flex-direction: column-reverse;
                height: auto;
                padding: 30px 20px;
                text-align: center;
            }
            .left-content {
                align-items: center;
                margin-top: 20px;
            }
            .letter-card {
                flex-direction: column;
            }
            .letter-right {
                padding-left: 0;
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Main Card Screen -->
    <div class="wrapper">
        <div class="left-content">
            <h1>Happy Birthday</h1>
            <div class="date-badge">23 May 2005</div>
            <button class="click-btn" id="openCardBtn">Click here</button>
        </div>
        <div class="right-content">
            <div class="avatar-container">
                <!-- Replace with your preferred image URL or local file name -->
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=400&auto=format&fit=crop" alt="Birthday Person">
            </div>
            <div class="name-tag">Hayati!</div>
        </div>
    </div>

    <!-- Pop-up Greeting Card Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="letter-card">
            <button class="close-btn" id="closeCardBtn">&times;</button>
            <div class="letter-left">
                <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=400&auto=format&fit=crop" alt="Cute Wish Graphic">
            </div>
            <div class="letter-right">
                <h3>To You ❤️</h3>
                <p>Wishing you a day filled with happiness and a year filled with joy. May all your dreams and wishes come true today and always! Have an absolute blast! ✨</p>
            </div>
        </div>
    </div>

    <!-- JavaScript for Floating Hearts and Modal Interactions -->
    <script>
        // Modal functionality
        const openBtn = document.getElementById('openCardBtn');
        const closeBtn = document.getElementById('closeCardBtn');
        const modalOverlay = document.getElementById('modalOverlay');

        openBtn.addEventListener('click', () => {
            modalOverlay.classList.add('active');
        });

        closeBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });

        // Floating Hearts Generator
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            // Random horizontal positioning and sizing
            heart.style.left = Math.random() * window.innerWidth + 'px';
            const size = Math.random() * 20 + 15; // between 15px and 35px
            heart.style.width = size + 'px';
            heart.style.height = size + 'px';
            
            // Random animation duration
            const duration = Math.random() * 2 + 3; // between 3s and 5s
            heart.style.animationDuration = duration + 's';
            
            document.body.appendChild(heart);

            // Remove heart after animation completes
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // Generate hearts continuously
        setInterval(createHeart, 300);
    </script>
</body>
</html>
